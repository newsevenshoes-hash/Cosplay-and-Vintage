<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cosplay & Vintage Inventory</title>
    <link rel="icon" type="image/png" href="FAVICON COSPLAYER.png">
    <link rel="apple-touch-icon" href="COSPLAY_AND_VINTAGE logo.jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-900" x-data="app()">

    <header class="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-xl border-b border-slate-800">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="COSPLAY_AND_VINTAGE logo.jpeg" alt="Logo" class="h-10 w-10 object-contain rounded bg-white p-1">
                <div>
                    <h1 class="text-xl font-black tracking-tighter uppercase leading-none text-pink-500">Cosplay & Vintage</h1>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Idee e Materiali</p>
                </div>
            </div>
            
            <div class="flex gap-2">
                <a href="https://imgbb.com/upload" target="_blank" 
                   class="bg-amber-500 hover:bg-amber-600 text-slate-900 px-3 py-2 rounded-xl flex items-center gap-2 transition-transform active:scale-95 shadow-lg">
                    <span class="text-lg">📸</span>
                    <span class="text-[10px] font-black uppercase hidden sm:inline">Carica Foto</span>
                </a>

                <button @click="window.open('https://docs.google.com/spreadsheets/d/1kt_7aXRlf_GSFIY0-oFN6mc18YMtQDUtNQWObGiJm_Y/edit', '_blank')" 
                        class="bg-pink-600 hover:bg-pink-700 p-2 rounded-xl transition-transform active:scale-95 shadow-lg">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4">
        <div class="relative mb-6">
            <input type="text" x-model="search" placeholder="Cerca nel catalogo vintage..." 
                   class="w-full bg-white border-2 border-slate-200 p-4 pl-12 rounded-2xl shadow-sm focus:border-pink-500 focus:ring-0 transition-all outline-none">
            <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </div>

        <div class="grid gap-4">
            <template x-for="item in filteredItems()" :key="item.id">
                <div class="bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-100 flex h-40">
                    <div class="w-32 h-full bg-slate-200 flex-shrink-0 relative overflow-hidden">
                        <img :src="item.foto || 'https://via.placeholder.com/300x300?text=No+Photo'" 
                             class="w-full h-full object-cover">
                        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/50 to-transparent p-2">
                             <span class="text-[10px] font-bold text-white uppercase" x-text="'#' + item.id"></span>
                        </div>
                    </div>

                    <div class="p-4 flex-grow flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start">
                                <h2 class="text-sm font-black text-slate-800 uppercase leading-tight line-clamp-2" x-text="item.descrizione"></h2>
                                <span class="bg-pink-50 text-pink-700 font-black px-2 py-1 rounded-lg text-xs ml-2" x-text="'€' + item.prezzo"></span>
                            </div>
                        </div>

                        <div class="flex justify-between items-end">
                            <a :href="'https://wa.me/39XXXXXXXXXX?text=' + encodeURIComponent('Ciao! Info su Cosplay/Vintage: #' + item.id + ' - ' + item.descrizione)" 
                               target="_blank"
                               class="bg-green-500 text-white text-[10px] font-black uppercase px-3 py-2 rounded-lg flex items-center gap-1">
                                WhatsApp 💬
                            </a>
                            <div class="text-right">
                                <span class="text-[9px] font-bold uppercase text-slate-400 block">Disp.</span>
                                <span class="text-slate-900 text-base font-black leading-none" x-text="item.pezzi"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </main>

    <script>
        function app() {
            return {
                search: '',
                items: [],
                // URL Pubblicato come CSV (Assicurati che sia pubblicato sul web come CSV)
                urlCSV: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTE2UbeidDclX6B5qN_Uv819U9r_G7L780fI5o8_pC4C56uW3p5Qv6H-fS99pGq_H6pG_p_q_p_q_p_q/pub?output=csv',
                
                async init() {
                    try {
                        const response = await fetch(this.urlCSV);
                        const data = await response.text();
                        this.items = this.parseCSV(data);
                    } catch (e) {
                        console.error("Errore nel caricamento dati");
                    }
                },

                parseCSV(csv) {
                    const lines = csv.split('\n').slice(1);
                    return lines.filter(line => line.trim() !== '').map(line => {
                        const [id, descrizione, pezzi, prezzo, foto] = line.split(',');
                        return { id, descrizione, pezzi, prezzo, foto: foto?.trim() };
                    });
                },

                filteredItems() {
                    return this.items.filter(i => 
                        i.id.toLowerCase().includes(this.search.toLowerCase()) || 
                        i.descrizione.toLowerCase().includes(this.search.toLowerCase())
                    );
                }
            }
        }
    </script>
</body>
</html>
